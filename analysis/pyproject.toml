[project]
name = "offbeat-analysis"
version = "0.1.0"
description = "Local-first analysis service for OFFBEAT Bass Mirror"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
  "librosa>=0.11,<0.12",
  "soundfile>=0.13,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1", "jsonschema>=4.22,<5"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
target-version = "py311"
