name: Offbeat baseline CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Test phrase range and alignment helpers
        run: node --test src/lib/phraseRanges.test.mjs src/lib/browserFeatures.test.mjs src/lib/sessionPortable.test.mjs src/lib/grooveEngine.test.mjs src/lib/grooveAudio.test.mjs
      - name: Test FORM mobile rhythm and plucked bass
        run: node --test scripts/form_rhythm.test.cjs scripts/form_bass.test.cjs scripts/form_pluck.test.cjs scripts/form_studio_bass.test.cjs scripts/form_glide.test.cjs scripts/form_frame.test.cjs scripts/form_gesture.test.cjs
      - name: Parse FORM Groove Frame browser modules
        run: |
          node --check public/instrument/frame/core.mjs
          node --check public/instrument/frame/audio.mjs
          node --check public/instrument/frame/ui.mjs
          node --check public/instrument/gesture/physics.mjs
          node --check public/instrument/gesture/app.mjs
      - name: Build Vite app
        run: npm run build

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python engine + tests
        working-directory: analysis
        run: python -m pip install -e '.[dev]'
      - name: Run analysis and contract tests
        working-directory: analysis
        run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install application and smoke test dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -e './analysis[dev]' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Start localhost frontend and Python worker
        run: |
          python -m uvicorn offbeat.api:app --app-dir analysis --host 127.0.0.1 --port 8765 > /tmp/offbeat-worker.log 2>&1 &
          npm run dev -- --host 127.0.0.1 > /tmp/offbeat-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -fsS http://127.0.0.1:8765/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/offbeat-worker.log /tmp/offbeat-vite.log
          exit 1
      - name: Run actual browser journey with synthetic audio and fake microphone
        run: |
          python scripts/browser_smoke.py
          python scripts/mobile_browser_smoke.py
          python scripts/mobile_failure_smoke.py
          python scripts/form_browser_smoke.py
          python scripts/form_frame_browser_smoke.py
          python scripts/form_gesture_browser_smoke.py
