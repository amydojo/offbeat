name: Offbeat baseline CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend (legacy lockfile to be regenerated)
        run: npm install --no-audit --no-fund
      - name: Build Vite app
        run: npm run build

  lockfile_bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/bass-mirror-foundation-01' && github.event.pull_request.head.repo.full_name == 'amydojo/offbeat'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical npm lockfile without running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package-lock.json
          git commit -m "chore: regenerate Offbeat npm lockfile"
          git push origin HEAD:refs/heads/feat/bass-mirror-foundation-01
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python engine + tests
        working-directory: analysis
        run: python -m pip install -e '.[dev]'
      - name: Run analysis and contract tests
        working-directory: analysis
        run: python -m pytest -q
